# Netlify reads this automatically. Static output only: no functions.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Files in /_astro/ have content hashes in their names, so they can be
# cached forever. Everything else revalidates.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
