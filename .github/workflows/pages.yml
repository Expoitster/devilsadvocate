# Builds the static site and publishes it to GitHub Pages.
# One-time setup: repo Settings > Pages > Build and deployment > Source:
# "GitHub Actions". The live URL is https://<owner>.github.io/<repo>/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/lucid-planck-8061mj, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Reads the Pages URL, so links and the sitemap match where the site
      # is served (/<repo>/ now, or the root once a custom domain is set).
      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Waitlist settings. All three are public by design: the URL and the
          # publishable key end up in the page's JavaScript (row-level security
          # is what protects the table), and the email is shown on /privacy.
          # A repository variable of the same name (Settings > Secrets and
          # variables > Actions > Variables) overrides the default here.
          # Never put a service_role / secret key in this file.
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL || 'https://wrkvjmsxkfvsjkfaycam.supabase.co' }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_IPX7IS0lvLxVTEm04CQ65Q_F72-Oquw' }}
          PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL || 'avinashdev.garudapalli2027@mastersunion.org' }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
